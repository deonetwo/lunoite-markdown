name: Release Desktop & Mobile App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-desktop:
    name: Build Desktop (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Desktop App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'lunoite ${{ github.ref_name }}'
          releaseBody: 'Automated cross-platform release for Windows, macOS, Linux, Android, and iOS.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    name: Build Android APK (Tauri v2)
    runs-on: ubuntu-latest
    needs: release-desktop
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install npm dependencies
        run: npm ci

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Upload Android Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: lunoite-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release-ios:
    name: Build iOS (Tauri v2)
    runs-on: macos-latest
    needs: release-desktop
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize and Build iOS Archive
        run: |
          npx tauri ios init --ci
          cd src-tauri/gen/apple
          SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[] | select(endswith("_iOS")) // .project.schemes[0]')
          echo "Building scheme: $SCHEME"
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r lunoite-ios-unsigned.ipa Payload

      - name: Upload iOS IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: src-tauri/gen/apple/lunoite-ios-unsigned.ipa

      - name: Upload iOS Artifact (Workflow Run)
        uses: actions/upload-artifact@v4
        with:
          name: lunoite-ios-ipa
          path: src-tauri/gen/apple/lunoite-ios-unsigned.ipa
